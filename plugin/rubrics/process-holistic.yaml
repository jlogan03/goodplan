id: process-holistic
version: 1
dimensions:
  - name: invariant-compliance
    description: Does the artifact respect all declared invariants and preconditions?
    scoring: "1-10: 1=violates core invariants, 5=mostly compliant with minor gaps, 10=fully compliant with all invariants verified"
    threshold: 9
  - name: context-transport
    description: Is context properly propagated between phases without information loss?
    scoring: "1-10: 1=context dropped between phases, 5=key context preserved, 10=full context chain with traceability"
    threshold: 9
  - name: verification-plausibility
    description: Are verification steps realistic, automatable, and likely to catch regressions?
    scoring: "1-10: 1=no verification or manual-only, 5=some automated checks, 10=comprehensive automated verification"
    threshold: 9
convergence:
  max_rounds: 8
  zero_blocking_required: true
  zero_critical_required: true
