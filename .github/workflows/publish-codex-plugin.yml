name: Build and Publish Codex Plugin

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install

      - name: Build Codex plugin
        run: bun run build:codex
        env:
          GP_HMAC_KEY: ${{ secrets.GP_HMAC_KEY }}
          GOODPLAN_BINARY_PLATFORMS: macos-arm64,macos-x64,linux-arm64,linux-x64

      - name: Post-build version assertion
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
          else
            EXPECTED_VERSION=$(node -p 'require("./package.json").version')
          fi
          NATIVE_PLATFORM=$(python3 - <<'PY'
          import platform
          mapping = {
              ("Darwin", "arm64"): "macos-arm64",
              ("Darwin", "x86_64"): "macos-x64",
              ("Linux", "aarch64"): "linux-arm64",
              ("Linux", "x86_64"): "linux-x64",
          }
          print(mapping[(platform.system(), platform.machine())])
          PY
          )
          for PLATFORM in macos-arm64 macos-x64 linux-arm64 linux-x64; do
            test -x "./plugins/gp/binaries/$PLATFORM/gp" || { echo "Missing binary for $PLATFORM"; exit 1; }
            echo "Binary present ($PLATFORM)"
          done
          BINARY_VERSION=$(./plugins/gp/binaries/$NATIVE_PLATFORM/gp --version --json | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])")
          echo "Native binary version ($NATIVE_PLATFORM): $BINARY_VERSION"
          echo "Expected version: $EXPECTED_VERSION"
          [ "$BINARY_VERSION" = "$EXPECTED_VERSION" ] || { echo "Version mismatch for $NATIVE_PLATFORM: binary=$BINARY_VERSION expected=$EXPECTED_VERSION"; exit 1; }

      - name: Validate Codex marketplace payload
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          plugin_manifest = Path("plugins/gp/.codex-plugin/plugin.json")
          marketplace = Path(".agents/plugins/marketplace.json")
          hooks = Path("plugins/gp/hooks.json")
          assert plugin_manifest.exists(), f"Missing {plugin_manifest}"
          assert marketplace.exists(), f"Missing {marketplace}"
          assert hooks.exists(), f"Missing {hooks}"

          plugin = json.loads(plugin_manifest.read_text())
          market = json.loads(marketplace.read_text())
          assert plugin["name"] == "gp"
          assert plugin["interface"]["displayName"] == "goodplan"
          entry = next((p for p in market["plugins"] if p["name"] == "gp"), None)
          assert entry is not None, "gp missing from marketplace.json"
          assert entry["source"]["source"] == "local"
          assert entry["source"]["path"] == "./plugins/gp"
          assert entry["policy"]["installation"] in {"AVAILABLE", "INSTALLED_BY_DEFAULT", "NOT_AVAILABLE"}
          assert entry["policy"]["authentication"] in {"ON_INSTALL", "ON_USE"}
          assert entry["category"] == "Coding"
          PY

      - name: Create tarball
        run: tar -czf goodplan-codex-plugin-${{ github.ref_name }}.tar.gz .agents/plugins/marketplace.json plugins/gp

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          files: goodplan-codex-plugin-${{ github.ref_name }}.tar.gz
