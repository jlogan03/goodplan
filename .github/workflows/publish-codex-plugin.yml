name: Build and Publish Codex Plugin

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: codex-release-pipeline
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install

      - name: Build Codex plugin
        run: bun run build:codex
        env:
          GP_HMAC_KEY: ${{ secrets.GP_HMAC_KEY }}
          GOODPLAN_BINARY_PLATFORM: macos-arm64

      - name: Post-build version assertion
        run: |
          BINARY_VERSION=$(./plugins/goodplan/binaries/macos-arm64/gp --version --json | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
          else
            EXPECTED_VERSION=$(node -p 'require("./package.json").version')
          fi
          echo "Binary version: $BINARY_VERSION"
          echo "Expected version: $EXPECTED_VERSION"
          [ "$BINARY_VERSION" = "$EXPECTED_VERSION" ] || { echo "Version mismatch: binary=$BINARY_VERSION expected=$EXPECTED_VERSION"; exit 1; }

      - name: Validate Codex marketplace payload
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          plugin_manifest = Path("plugins/goodplan/.codex-plugin/plugin.json")
          marketplace = Path(".agents/plugins/marketplace.json")
          hooks = Path("plugins/goodplan/hooks.json")
          assert plugin_manifest.exists(), f"Missing {plugin_manifest}"
          assert marketplace.exists(), f"Missing {marketplace}"
          assert hooks.exists(), f"Missing {hooks}"

          plugin = json.loads(plugin_manifest.read_text())
          market = json.loads(marketplace.read_text())
          assert plugin["name"] == "goodplan"
          entry = next((p for p in market["plugins"] if p["name"] == "goodplan"), None)
          assert entry is not None, "goodplan missing from marketplace.json"
          assert entry["source"]["source"] == "local"
          assert entry["source"]["path"] == "./plugins/goodplan"
          assert entry["policy"]["installation"] in {"AVAILABLE", "INSTALLED_BY_DEFAULT", "NOT_AVAILABLE"}
          assert entry["policy"]["authentication"] in {"ON_INSTALL", "ON_USE"}
          assert entry["category"] == "Coding"
          PY

      - name: Create tarball
        run: tar -czf goodplan-codex-plugin-${{ github.ref_name }}.tar.gz .agents/plugins/marketplace.json plugins/goodplan

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          files: goodplan-codex-plugin-${{ github.ref_name }}.tar.gz

      - name: Prepare release branch content
        run: |
          mkdir -p tmp-release/.agents/plugins tmp-release/plugins
          cp .agents/plugins/marketplace.json tmp-release/.agents/plugins/
          cp -R plugins/goodplan tmp-release/plugins/goodplan

      - name: Tag release branch for rollback
        if: github.ref_type == 'tag'
        run: |
          if git ls-remote --heads origin codex-release | grep -q codex-release; then
            git fetch origin codex-release
            git tag "codex-release-before-${{ github.ref_name }}" origin/codex-release
            git push origin "codex-release-before-${{ github.ref_name }}"
            echo "Tagged codex-release branch HEAD as codex-release-before-${{ github.ref_name }}"
          else
            echo "No existing codex-release branch — skipping rollback tag"
          fi

      - name: Publish to codex-release branch
        if: github.ref_type == 'tag'
        run: |
          cd tmp-release
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b codex-release
          git add -A
          git commit -m "Codex release ${{ github.ref_name }}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:refs/heads/codex-release
          echo "Published to codex-release branch"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
